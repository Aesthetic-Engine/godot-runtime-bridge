name: GRB Release Smoke

on:
  push:
    paths:
      - ".github/workflows/grb-release-smoke.yml"
      - "addons/godot-runtime-bridge/**"
      - "cli/**"
      - "templates/grb2/**"
      - "tools/**"
      - "examples/grb2-proving-ground/**"
      - "grb"
      - "grb.cmd"
      - "mcp/**"
      - "missions/**"
      - "README.md"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - ".github/workflows/grb-release-smoke.yml"
      - "addons/godot-runtime-bridge/**"
      - "cli/**"
      - "templates/grb2/**"
      - "tools/**"
      - "examples/grb2-proving-ground/**"
      - "grb"
      - "grb.cmd"
      - "mcp/**"
      - "missions/**"
      - "README.md"
      - "CHANGELOG.md"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Run GRB 2.0 product-shape verification
        working-directory: mcp
        run: npm run verify:grb2:shape

      - name: Download Godot
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L "https://downloads.godotengine.org/?version=4.6&flavor=stable&slug=linux.x86_64.zip&platform=linux.64" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN=$(ls "$RUNNER_TEMP/godot"/Godot_*_linux.x86_64 | head -n 1)
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Create smoke project
        run: |
          mkdir -p "$RUNNER_TEMP/grb-smoke-project/addons"
          cp -R "$GITHUB_WORKSPACE/addons/godot-runtime-bridge" "$RUNNER_TEMP/grb-smoke-project/addons/"
          cat > "$RUNNER_TEMP/grb-smoke-project/project.godot" <<'EOF'
          config_version=5

          [application]

          config/name="GRB Smoke Project"
          run/main_scene="res://Main.tscn"

          [autoload]

          GRBServer="*res://addons/godot-runtime-bridge/runtime_bridge/DebugServer.gd"
          EOF
          cat > "$RUNNER_TEMP/grb-smoke-project/Main.tscn" <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node"]
          EOF

      - name: Run GRB release verification
        working-directory: mcp
        run: xvfb-run -a npm run verify:release -- --godot-exe "$GODOT_BIN" --project "$RUNNER_TEMP/grb-smoke-project"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grb-release-smoke
          path: mcp/reports/release-smoke

      - name: Exercise GRB 2.0 first-run path (init → doctor → mission run smoke_boot)
        env:
          GRB_FIRST_RUN_PROJECT: ${{ runner.temp }}/grb-first-run-project
        run: |
          set -euo pipefail

          # Build a fresh minimal Godot project with the GRB addon, distinct
          # from the earlier release-smoke project. This proves the full first
          # -run path (init → doctor → mission run smoke_boot) end to end, not
          # just the release-smoke subset.
          mkdir -p "$GRB_FIRST_RUN_PROJECT/addons"
          cp -R "$GITHUB_WORKSPACE/addons/godot-runtime-bridge" "$GRB_FIRST_RUN_PROJECT/addons/"
          cat > "$GRB_FIRST_RUN_PROJECT/project.godot" <<'EOF'
          config_version=5

          [application]

          config/name="GRB First-Run Project"
          run/main_scene="res://Main.tscn"

          [autoload]

          GRBServer="*res://addons/godot-runtime-bridge/runtime_bridge/DebugServer.gd"
          EOF
          cat > "$GRB_FIRST_RUN_PROJECT/Main.tscn" <<'EOF'
          [gd_scene format=3]

          [node name="Main" type="Node"]
          EOF

          # Let Godot generate .godot/ metadata so doctor and smoke_boot's
          # first-run readiness guards do not refuse a never-opened project.
          # `--headless --editor --quit` opens the editor headlessly long
          # enough to materialize .godot/. Plain `--headless --quit` runs the
          # game and exits without producing any import metadata, which is
          # exactly what the Slice 3 .godot/ guard is designed to catch.
          xvfb-run -a "$GODOT_BIN" --headless --editor --quit --path "$GRB_FIRST_RUN_PROJECT"
          if [ ! -d "$GRB_FIRST_RUN_PROJECT/.godot" ]; then
            echo "ERROR: .godot/ metadata was not generated by the headless editor pass." >&2
            echo "Project root contents:" >&2
            ls -la "$GRB_FIRST_RUN_PROJECT" >&2
            exit 1
          fi

          # 1. init: scaffold grb.project.yaml, grb/, and record repo linkage.
          ./grb init --project "$GRB_FIRST_RUN_PROJECT"

          # 2. doctor: fail the job if the first-run path is not truly ready.
          ./grb doctor --project "$GRB_FIRST_RUN_PROJECT" --exe "$GODOT_BIN"

          # 3. mission run smoke_boot: exit code 0 means the proof bundle
          #    landed and smoke_boot was not blocked.
          xvfb-run -a ./grb mission run smoke_boot --project "$GRB_FIRST_RUN_PROJECT" --exe "$GODOT_BIN"

      - name: Upload first-run proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grb-first-run-proof
          path: ${{ runner.temp }}/grb-first-run-project/grb_reports/
