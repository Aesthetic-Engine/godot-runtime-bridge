name: TODO Project Name
grb_version: "2.0"
# grb init records the full-repo GRB clone this project should use for proof commands.
grb_repo_root: <set-by-grb-init>
default_recipe: default
missions:
  - smoke_boot
read_first:
  - AGENTS.md
  - grb.project.yaml
  - grb/proof_policy.yaml
  - grb/missions/smoke_boot.yaml
  - grb/gotchas.md
  # Stage-specific docs; AGENTS.md explains when to use each one.
  - grb/mission_authoring.md
  - grb/runtime_proof_hooks.md
  - grb/regression_workflow.md
expected_first_run:
  scene_or_state: TODO describe the first visible state after launch
  primary_human_check: TODO describe what the boot screenshot should show
proof_reports_dir: grb_reports
first_trustworthy_proof_run:
  # grb init records the concrete repo-root launcher command for this project.
  command: <set-by-grb-init>
  inspect: grb_reports/<run-id>/summary.md
