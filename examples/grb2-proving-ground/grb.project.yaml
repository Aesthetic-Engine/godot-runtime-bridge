name: GRB 2.0 Proving Ground
grb_version: "2.0"
default_recipe: default
missions:
  - smoke_boot
  - scene_transition
  - toggle_panel
  - hud_state_check
read_first:
  - README.md
  - AGENTS.md
  - grb.project.yaml
  - grb/proof_policy.yaml
  - grb/missions/smoke_boot.yaml
  - grb/gotchas.md
  # Stage-specific docs; AGENTS.md explains when to use each one.
  - grb/regression_workflow.md
expected_first_run:
  scene_or_state: stable title/boot surface
  primary_human_check: boot screenshot shows the GRB 2.0 Proving Ground title, HUD labels, and deterministic title state
proof_reports_dir: grb_reports
first_trustworthy_proof_run:
  command: node ../../cli/grb.mjs mission run smoke_boot --exe <godot_exe>
  inspect: grb_reports/<run-id>/summary.md
